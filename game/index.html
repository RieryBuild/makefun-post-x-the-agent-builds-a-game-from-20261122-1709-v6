<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON KOI — one prompt, one game</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02141c;
    font-family:'DejaVu Sans',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;color:#eafcff;z-index:5}
  .hidden{display:none !important}
  #title{background:radial-gradient(ellipse at 50% 42%,rgba(2,32,44,.25) 0%,rgba(1,12,20,.72) 78%)}
  #over{background:rgba(1,10,18,.66)}
  h1{margin:0;font-size:118px;line-height:.95;letter-spacing:4px;color:#fff;
    text-shadow:0 0 24px #19e3ff,0 0 60px #19e3ff,0 4px 0 rgba(0,0,0,.35)}
  h1 .koi{color:#ff8a5c;text-shadow:0 0 24px #ff6a3d,0 0 60px #ff6a3d,0 4px 0 rgba(0,0,0,.35)}
  .tag{margin-top:14px;font-size:34px;color:#9beaff;letter-spacing:3px}
  #titleKoi{width:640px;max-width:82vw;margin:26px 0 6px}
  .rules{font-size:36px;line-height:1.55;color:#eafcff}
  .rules b{color:#ffd94a}.rules .bad{color:#ff5c7a}
  .cta{margin-top:34px;font-size:40px;font-weight:bold;color:#02141c;background:#19e3ff;
    padding:18px 44px;border-radius:999px;box-shadow:0 0 34px rgba(25,227,255,.8);
    animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #hud{position:absolute;inset:0;pointer-events:none;z-index:4}
  #score{position:absolute;top:34px;left:0;right:0;text-align:center;font-size:120px;font-weight:bold;
    line-height:1;color:#fff;text-shadow:0 0 22px #19e3ff,0 0 55px rgba(25,227,255,.7),0 4px 0 rgba(0,0,0,.4)}
  #lives{position:absolute;top:52px;left:44px;font-size:52px;color:#ff5c7a;letter-spacing:6px;
    text-shadow:0 0 18px rgba(255,92,122,.9)}
  #best{position:absolute;top:56px;right:44px;font-size:34px;color:#9beaff;text-shadow:0 0 14px rgba(25,227,255,.8)}
  #flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,40,70,.55) 100%);
    opacity:0;pointer-events:none;z-index:6;transition:opacity .12s}
  #finalScore{font-size:150px;font-weight:bold;color:#ffd94a;text-shadow:0 0 30px rgba(255,217,74,.9),0 4px 0 rgba(0,0,0,.4)}
  #finalBest{font-size:38px;color:#9beaff;margin-top:6px}
  h2{margin:0;font-size:96px;color:#fff;text-shadow:0 0 24px #ff5c7a,0 0 60px rgba(255,92,122,.7)}
  .foot{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:28px;color:#6fa8bb;letter-spacing:2px}
</style>
</head>

    <div id="best">BEST 0</div>

    <div class="tag">ONE PROMPT · ONE GAME</div>

    <div class="cta">TAP OR PRESS SPACE TO SWIM</div>
    <div class="foot">← → arrows · mouse · touch — the pond speeds up as you score</div>
  </div>
  <div id="over" class="screen hidden">
    <h2>GAME OVER</h2>
    <div id="finalScore">0</div>
    <div id="finalBest">BEST 0</div>
    <div class="cta">SWIM AGAIN</div>

  </div>
</div>

var art={}, loaded=0;
['bg','koi','pearl','hook'].forEach(function(k){
  var im=new Image();
  im.onload=function(){ loaded++; if(loaded===4) titleKoi.src=IMG.koiTitle; };
  im.src=IMG[k]; art[k]=im;
});

var G={
  state:'title', score:0, lives:3,
  best:parseInt(localStorage.getItem('neon-koi-best')||'0',10)||0,
  koiX:W/2, koiTarget:W/2, facing:1,
  pearls:[], hooks:[], flashes:[],
  spawnP:0, spawnH:0, elapsed:0, invuln:0, shake:0
};
window.__game=G;
G.start=function(){
  G.state='playing'; G.score=0; G.lives=3;
  G.koiX=W/2; G.koiTarget=W/2; G.pearls=[]; G.hooks=[]; G.flashes=[];
  G.spawnP=0; G.spawnH=0; G.elapsed=0; G.invuln=0; G.shake=0;
  // pre-seed pearls so the action is dense from second 0
  for(var i=0;i<6;i++) spawnPearl(120+i*230+Math.random()*90);
  titleEl.classList.add('hidden'); overEl.classList.add('hidden'); hudEl.classList.remove('hidden');
  syncHud();
};
G.moveTo=function(x){ G.koiTarget=Math.max(90,Math.min(W-90,x)); };
function syncHud(){
  scoreEl.textContent=G.score;
  livesEl.textContent='♥'.repeat(Math.max(0,G.lives));
  bestEl.textContent='BEST '+Math.max(G.best,G.score);
}
function speed(){ return Math.min(620, 250 + G.score*7); }
function spawnPearl(y){
  G.pearls.push({x:70+Math.random()*(W-140), y:(y!==undefined?y:-60-Math.random()*160),
    r:34+Math.random()*14, vy:0, sway:Math.random()*Math.PI*2, ph:Math.random()*Math.PI*2});
}
function spawnHook(){
  G.hooks.push({x:90+Math.random()*(W-180), y:-140, vy:0, sway:Math.random()*Math.PI*2, ph:Math.random()*Math.PI*2});
}
function gameOver(){
  G.state='over';
  if(G.score>G.best){ G.best=G.score; localStorage.setItem('neon-koi-best',String(G.best)); }
  finalScoreEl.textContent=G.score; finalBestEl.textContent='BEST '+G.best;
  overEl.classList.remove('hidden'); hudEl.classList.add('hidden');
}
function step(dt){
  if(G.state!=='playing') return;
  G.elapsed+=dt;
  var v=speed();
  // koi glides toward target; flip to face travel direction
  var dx=G.koiTarget-G.koiX;
  if(Math.abs(dx)>6) G.facing = dx>0 ? 1 : -1;
  G.koiX += Math.max(-640*dt, Math.min(640*dt, dx*10*dt));
  if(G.invuln>0) G.invuln-=dt;
  if(G.shake>0) G.shake-=dt;
  // spawns
  G.spawnP-=dt; if(G.spawnP<=0){ spawnPearl(); G.spawnP=Math.max(0.42, 0.95-G.score*0.012); }
  G.spawnH-=dt; if(G.spawnH<=0){ spawnHook(); G.spawnH=Math.max(1.35, 2.6-G.score*0.02); }
  var ky=KOI_Y+Math.sin(G.elapsed*2.2)*14;
  // pearls
  for(var i=G.pearls.length-1;i>=0;i--){
    var p=G.pearls[i];
    p.y+=(v*0.85)*dt; p.sway+=dt*1.6; p.x+=Math.sin(p.sway)*34*dt;
    if(p.y>H+80){ G.pearls.splice(i,1); continue; }
    if(Math.abs(p.x-G.koiX)<175 && Math.abs(p.y-ky)<125){
      G.pearls.splice(i,1); G.score++; syncHud();
      G.flashes.push({x:p.x,y:p.y,t:0});
    }
  }
  // hooks
  for(var j=G.hooks.length-1;j>=0;j--){
    var h=G.hooks[j];
    h.y+=(v*0.95)*dt; h.sway+=dt*1.1; h.x+=Math.sin(h.sway)*26*dt;
    if(h.y>H+180){ G.hooks.splice(j,1); continue; }
    if(G.invuln<=0 && Math.abs(h.x-G.koiX)<115 && Math.abs(h.y-ky)<130){
      G.hooks.splice(j,1); G.lives--; syncHud();
      G.invuln=1.6; G.shake=0.35;
      flashEl.style.opacity='1'; setTimeout(function(){ flashEl.style.opacity='0'; },140);
      if(G.lives<=0) gameOver();
    }
  }
  // catch flashes (the pearl sprite itself, blooming out)
  for(var k=G.flashes.length-1;k>=0;k--){
    G.flashes[k].t+=dt; if(G.flashes[k].t>0.45) G.flashes.splice(k,1);
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0) ctx.translate((Math.random()-0.5)*16*G.shake/0.35,(Math.random()-0.5)*16*G.shake/0.35);
  if(loaded===4) ctx.drawImage(art.bg,0,0,W,H);
  else { ctx.fillStyle='#02141c'; ctx.fillRect(0,0,W,H); }
  if(G.state!=='title'){
    ctx.globalCompositeOperation='lighter';
    // hooks (dark body + crimson rim: the rim reads on the dark pond)
    for(var j=0;j<G.hooks.length;j++){
      var h=G.hooks[j];
      ctx.drawImage(art.hook, h.x-72, h.y-200, 144, 400);
    }
    // pearls
    for(var i=0;i<G.pearls.length;i++){
      var p=G.pearls[i], s=p.r*2.6;
      ctx.drawImage(art.pearl, p.x-s/2, p.y-s/2, s, s);
    }
    // catch flashes
    for(var k=0;k<G.flashes.length;k++){
      var f=G.flashes[k], fs=120+f.t*420;
      ctx.globalAlpha=Math.max(0,1-f.t/0.45);
      ctx.drawImage(art.pearl, f.x-fs/2, f.y-fs/2, fs, fs);
      ctx.globalAlpha=1;
    }
    // koi (flips to face travel direction; blinks while invulnerable)
    var ky=KOI_Y+Math.sin(G.elapsed*2.2)*14;
    var kw=400, kh=kw*369/640;
    if(G.invuln>0 && Math.floor(G.elapsed*12)%2===0) ctx.globalAlpha=0.35;
    ctx.save();
    ctx.translate(G.koiX,ky);
    ctx.scale(G.facing,1);
    ctx.drawImage(art.koi,-kw/2,-kh/2,kw,kh);
    ctx.restore();
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();
  if(G.state==='title' && loaded===4){
    // idle koi drifting behind the title card
    ctx.globalCompositeOperation='lighter';
    var tx=W/2+Math.sin(performance.now()/1400)*160, ty=1350+Math.sin(performance.now()/900)*26;
    ctx.globalAlpha=0.85;
    ctx.drawImage(art.koi,tx-300,ty-86,600,346);
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
}
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  step(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- controls ----
function pressStart(){ if(G.state!=='playing') G.start(); }
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); pressStart(); return; }
  if(G.state!=='playing') return;
  if(e.code==='ArrowLeft'){ G.moveTo(G.koiTarget-170); e.preventDefault(); }
  if(e.code==='ArrowRight'){ G.moveTo(G.koiTarget+170); e.preventDefault(); }
});
function pointerX(e){
  var r=cv.getBoundingClientRect();
  return (e.clientX-r.left)*W/r.width;
}
cv.addEventListener('pointerdown',function(e){ pressStart(); G.moveTo(pointerX(e)); });
cv.addEventListener('pointermove',function(e){ if(G.state==='playing') G.moveTo(pointerX(e)); });
titleEl.addEventListener('click',pressStart);
overEl.addEventListener('click',pressStart);
syncHud();
})();
</script>
